name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  validation:
    name: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install rust-script
        run: cargo install rust-script
      - name: Verify upstream hashes (.skill-lock.json)
        run: rust-script scripts/check.rs
      - name: Run SKILL.md frontmatter validation
        run: rust-script validation/run.rs

  test-rust:
    name: test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install rust-script
        run: cargo install rust-script
      - name: Run deployment contract tests
        run: rust-script --test tests/test_install.rs
      - name: Run packaging contract tests
        run: rust-script --test tests/test_build.rs
      - name: Run toolkit-setup tests
        run: rust-script --test tests/test_toolkit_setup.rs
      - name: Run GitHub verify tests
        run: rust-script --test tests/test_github_verify.rs
      - name: Run check tests
        run: rust-script --test tests/test_check.rs
      - name: Run Kimi distill tests
        run: rust-script --test tests/test_kimi_distill.rs

  test-shell:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bootstrap tests
        run: bash tests/test_bootstrap.sh
      - name: Run install tests
        run: bash tests/test_install.sh

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check rust-script formatting
        run: rustfmt --check deploy.rs validation/run.rs crates/validation/src/lib.rs crates/skill-index/src/lib.rs scripts/check.rs scripts/env-check.rs scripts/sync-upstream.rs tests/test_build.rs tests/test_install.rs tests/test_toolkit_setup.rs tests/test_check.rs tests/test_github_verify.rs tests/test_kimi_distill.rs

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy on validation crate
        run: cargo clippy --manifest-path crates/validation/Cargo.toml --all-targets -- -D warnings
      - name: Run clippy on skill-index crate
        run: cargo clippy --manifest-path crates/skill-index/Cargo.toml --all-targets -- -D warnings
      - name: Run clippy on distill-cli crate
        run: cargo clippy --manifest-path crates/distill-cli/Cargo.toml --all-targets -- -D warnings

  clippy-scripts:
    name: clippy-scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install rust-script
        run: cargo install rust-script
      - name: Run clippy on rust-script files
        run: |
          set -e
          for f in deploy.rs validation/run.rs scripts/check.rs scripts/env-check.rs scripts/sync-upstream.rs; do
            echo "::group::clippy $f"
            tmpdir=$(mktemp -d)
            rust-script --package --pkg-path "$tmpdir" "$f"
            cargo clippy --manifest-path "$tmpdir/Cargo.toml" -- -D warnings
            rm -rf "$tmpdir"
            echo "::endgroup::"
          done
          for f in tests/test_build.rs tests/test_install.rs tests/test_toolkit_setup.rs \
                   tests/test_check.rs tests/test_github_verify.rs tests/test_kimi_distill.rs; do
            echo "::group::clippy $f"
            tmpdir=$(mktemp -d)
            rust-script --package --pkg-path "$tmpdir" "$f"
            cargo clippy --manifest-path "$tmpdir/Cargo.toml" --tests -- -D warnings
            rm -rf "$tmpdir"
            echo "::endgroup::"
          done
